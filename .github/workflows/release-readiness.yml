name: Release readiness
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to inspect (read-only)
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
concurrency:
  group: release-readiness-${{ inputs.pr_number }}
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Inspect PR without executing PR code
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid PR number'; exit 1; }
          gh pr view "$PR_NUMBER" --json number,url,state,isDraft,baseRefName,headRefOid,mergeable,reviewDecision,statusCheckRollup > "$RUNNER_TEMP/release-pr.json"
          node .release/preflight.mjs "$RUNNER_TEMP/release-pr.json" | tee -a "$GITHUB_STEP_SUMMARY"
