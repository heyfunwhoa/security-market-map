name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    # Draft PRs skip CI; it runs when the PR is marked ready for review.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:research-integrity
      - run: npm test
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Formerly the separate "Release policy tests" workflow (release-policy.yml).
      - name: Release policy tests
        run: node --test .release/preflight.node-check.mjs .release/vercel-ignore.node-check.mjs .release/preview-draft.node-check.mjs
