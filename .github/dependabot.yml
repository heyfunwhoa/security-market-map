version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      # Keep @types/node on the major that matches the Node.js runtime in CI.
      # Raise it together with node-version, not on its own.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # These must move together; a PR that bumps only one of them fails CI.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      nextjs:
        patterns: ["next", "eslint-config-next", "@next/*"]
      # Everything else in one monthly PR to cut CI runs.
      npm-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
